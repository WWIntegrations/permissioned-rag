[project]
name = "permissioned-rag"
version = "0.1.0"
description = "Retrieval-augmented answering where access control runs inside Postgres before ranking and every citation is verified."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Wiktor Wojtarowicz" }]
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Local embedding model and cross-encoder reranker.
models = ["sentence-transformers>=3.0", "torch>=2.3"]
# Local generation on Apple silicon.
mlx = ["mlx-lm>=0.20"]
# Hosted generation through the Anthropic Messages API.
anthropic = ["anthropic>=0.40"]

[project.scripts]
prag = "prag.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
