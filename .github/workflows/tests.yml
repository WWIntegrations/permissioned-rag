name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          # The test roles have no password; trust is limited to this
          # throwaway service container.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PRAG_TEST_ADMIN_DSN: host=127.0.0.1 port=5432 dbname=postgres user=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # Core dependencies only: the tests need no models.
      - run: uv sync --no-default-groups --group dev
      - run: uv run --no-sync pytest -q
